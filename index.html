<!DOCTYPE html>
<html>
  <head>
    <title>Chat Bot</title>
    <link rel="stylesheet" href="chatbot.css">
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    
    <script type="text/babel">
      function ChatInput({chatMessages , setChatMessages}){
        const [inputText , setInputText] = React.useState('');
        const [isLoading , setLoading] = React.useState(false);
        function saveInput(event){
          setInputText(event.target.value);
        }
        async function  sendMessage(){
        if (isLoading || inputText === '') {
            return;
          }
          setLoading(true);
         const newUserChatMessages = [
            ...chatMessages , {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];
          setChatMessages(newUserChatMessages);
          setChatMessages([
            ...newUserChatMessages , {
              message: "loading",
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          setInputText('');
          const response = await Chatbot.getResponseAsync(inputText);
            setChatMessages([
              ...newUserChatMessages , {
                message: response,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);
          setLoading(false); 
        }
        return (
          <div className = "chat-input-container">
            <input
              className="chat-input" 
              placeholder="Send a message to ChatBot" 
              size = "30" 
              onChange={saveInput}
              onKeyDown= {handleKeyDown} 
              value = {inputText}
              />
            <button
              className="send-button"
              onClick={sendMessage}  
            >Send</button>
          </div >  
        );
      function handleKeyDown(event){
        if(event.key === 'Enter' && !event.shiftKey){
          event.preventDefault();
          if(!inputText.trim()) return;
          sendMessage();
        }
        if(event.key === 'Escape'){
          setInputText('');
        }
      }
    }
      
    
    
    function ChatMessage({message , sender}){
          return (
            <div className={
              sender === 'user' ? 
              'chat-message-user' : 
              'chat-message-robot'
            }>
              {sender === 'robot' && (
                <img src="robot.png" className="chat-message-profile"/>
              )}

              {message === 'loading' ?  
               <div class="spinner-container">
                <div class="spinner">
                  <div class="dot"></div>
                  <div class="dot"></div>
                  <div class="dot"></div>
                  <div class="dot"></div>
                  <div class="dot"></div>
                  <div class="dot"></div>
                </div>
              </div>
            : <div className="chat-message-text">{message}</div>}
              
              {sender === 'user' && (
                <img src="user.png" className="chat-message-profile"/>
              )}
            </div>
          );
      }




      function ChatMessagesComp({chatMessages}){
        const chatMessagesRef = React.useRef(null);
         React.useEffect(()=>{
          const containerElem = chatMessagesRef.current;
          if(containerElem){
            containerElem.scrollTop = containerElem.scrollHeight; 
          }
      },[chatMessages]);
        return (
          <div className='chat-message-containers'
          ref={chatMessagesRef}>
            {
              chatMessages.map((chatMessage)=>{
                  return(
                      <ChatMessage 
                        message = {chatMessage.message}
                        sender = {chatMessage.sender}
                        key = {chatMessage.id}                      
                      />  
                  );
              })
           }
        </div>
        );
      }



      
      function App(){
        const [chatMessages  , setChatMessages] = React.useState([]);
        
        return (

            <div className="app-container"> 
              {chatMessages.length === 0 && <p className = "welcomePara">Welcome to the chatbot project! Send a message using the textbox below.</p>}           
              <ChatMessagesComp
                chatMessages = {chatMessages} 
              />
              <ChatInput 
                chatMessages = {chatMessages} 
                setChatMessages = {setChatMessages}
              />
            </div>
        );
      }


      const container = document.querySelector('.js-container');
      const reactcontainer = ReactDOM.createRoot(container);
      reactcontainer.render(<App/>);
    </script>
  </body>
</html>
